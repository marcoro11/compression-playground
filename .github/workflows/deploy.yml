name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets the Pages deployment happen.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Every codec round-trips the corpus, and the encoders are checked against
      # answers that exist independently of this repo: Node's zlib accepts the
      # DEFLATE streams and the inflater decodes zlib's, the RFC's canonical-code
      # example, Apple's PackBits vector, the textbook LZW code sequence, the
      # JPEG standard's tables. A wrong bit is invisible in a screenshot; it is
      # not invisible here.
      - name: Verify the codecs
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
